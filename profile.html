<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Your Business Card - NFC Digital Business Card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <style>
    :root {
      --background: #f8f8f6;
      --accent: #e3ede6;
      --taupe-green: #46635f;
      --primary: #253528;
      --input-border: #b5c2b7;
      --input-bg: #f3f7f4;
      --card-radius: 18px;
      --card-shadow: 0 4px 32px rgba(70, 99, 95, 0.10);
      --button-bg: #46635f;
      --button-hover: #253528;
      --button-text: #fff;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, var(--background) 65%, var(--accent) 100%);
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .portrait-card {
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      max-width: 420px;
      width: 100%;
      padding: 48px 38px 32px 38px;
      text-align: center;
      margin: 0 auto;
    }
    h2 {
      color: var(--primary);
      font-size: 1.38rem;
      font-weight: 700;
      margin-bottom: 32px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    .profile-pic-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .profile-pic-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }
    .profile-pic-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      margin: 0;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      border: 0.5px solid var(--input-border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: box-shadow 0.2s;
      display: block;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    /* No label inside the circle */
    .edit-pic-btn {
      background: #fff;
      border-radius: 50%;
      border: 1px solid var(--input-border);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      transition: background 0.2s, border 0.2s;
      margin-left: 0;
    }
    .edit-pic-btn:hover {
      background: var(--accent);
      border-color: var(--primary);
    }
    .edit-icon {
      width: 18px;
      height: 18px;
      fill: #46635f;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 14px;
    }
    input[type="email"], input[type="password"], input[type="text"], input[type="file"], textarea {
      padding: 13px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      font-size: 1.07rem;
      color: var(--primary);
      outline: none;
      font-family: inherit;
      transition: border 0.2s, background 0.2s;
      margin-bottom: 0;
      box-sizing: border-box;
    }
    input[type="email"]:focus, input[type="password"]:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--taupe-green);
      background: #edf4ef;
    }
    textarea { resize: vertical; min-height: 40px;}
    button[type="submit"], #logoutBtn {
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 32px;
      padding: 15px 0;
      font-size: 1.13rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 18px;
      margin-bottom: 8px;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(70,99,95,0.06);
      letter-spacing: 1px;
    }
    button[type="submit"]:hover, #logoutBtn:hover {
      background: var(--button-hover);
    }
    #publicLink {
      color: var(--taupe-green);
      font-weight: 600;
      font-size: 1.01rem;
      margin-top: 10px;
      text-decoration: none;
      border-bottom: 1px dashed var(--taupe-green);
      transition: border 0.2s;
      display: inline-block;
    }
    #publicLink:hover {
      border-bottom: 2px solid var(--taupe-green);
      color: var(--primary);
    }
    #profileMsg {
      color: #d04b4b;
      font-size: 1.02rem;
      text-align: center;
      min-height: 24px;
      margin-top: 6px;
    }
    @media (max-width: 500px) {
      .container { padding: 0; }
      .portrait-card { padding: 22px 7vw 22px 7vw; }
      h2 { font-size: 1.09rem; }
      input, button { font-size: 0.98rem;}
      form { gap: 10px;}
      .profile-pic { width: 80px; height: 80px;}
      .profile-pic-wrapper { width: 80px; height: 80px;}
      .edit-pic-btn { width: 24px; height: 24px;}
      .profile-pic-row { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="portrait-card" id="profileCard">
      <h2>EDIT YOUR BUSINESS CARD</h2>
      <div class="profile-pic-section">
        <div class="profile-pic-row">
          <div class="profile-pic-wrapper" id="profilePicWrapper">
            <img id="profileImg" src="icons/default-profile.png" alt="Profile Picture" class="profile-pic">
            <input type="file" id="imgUpload" accept="image/*" style="display:none">
          </div>
          <button class="edit-pic-btn" id="editPicBtn" title="Edit photo" type="button">
            <svg class="edit-icon" viewBox="0 0 20 20"><path d="M14.846 3.897a2.211 2.211 0 0 1 3.13 3.13l-9.18 9.18-3.13.87.87-3.13 9.18-9.18zm-1.414-1.414l-9.18 9.18a1.5 1.5 0 0 0-.438.967l-.87 3.13a1 1 0 0 0 1.217 1.216l3.13-.87a1.5 1.5 0 0 0 .967-.438l9.18-9.18a3.211 3.211 0 1 0-4.376-4.376z"/></svg>
          </button>
        </div>
      </div>
      <form id="profileForm" enctype="multipart/form-data">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="text" id="jobTitle" placeholder="Job Title" required>
        <input type="text" id="company" placeholder="Company / Organization">
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phone" placeholder="Phone Number">
        <input type="text" id="website" placeholder="Website">
        <input type="text" id="facebook" placeholder="Facebook URL">
        <input type="text" id="instagram" placeholder="Instagram URL">
        <input type="text" id="linkedin" placeholder="LinkedIn URL">
        <input type="text" id="twitter" placeholder="Twitter URL">
        <input type="text" id="address" placeholder="Address">
        <button type="submit">Save</button>
      </form>
      <a id="publicLink" href="#">View Public Profile</a>
      <button id="logoutBtn">Logout</button>
      <div id="profileMsg"></div>
    </div>
  </div>
  <script type="module" src="firebase.js"></script>
  <script type="module">
    import { authCheck, getProfile, saveProfile, uploadProfilePic, logout, getPublicUrl } from './firebase.js';
    let uid, profileData;
    authCheck(async (user, username) => {
      uid = user.uid;
      profileData = await getProfile(username);
      Object.keys(profileData).forEach(k => {
        if(document.getElementById(k)) document.getElementById(k).value = profileData[k] || '';
      });
      if(profileData.photoURL) profileImg.src = profileData.photoURL;
      publicLink.href = getPublicUrl(username);
      publicLink.innerText = "View Public Profile";
    });
    editPicBtn.onclick = () => imgUpload.click();
    profileImg.onclick = () => imgUpload.click();
    imgUpload.onchange = async (e) => {
      const file = e.target.files[0];
      if(file) {
        const url = await uploadProfilePic(uid, file);
        profileImg.src = url;
        profileData.photoURL = url;
      }
    };
    profileForm.onsubmit = async (e) => {
      e.preventDefault();
      let data = {};
      ["fullName","jobTitle","company","email","phone","website","facebook","instagram","linkedin","twitter","address"].forEach(id=>{
        data[id]=document.getElementById(id).value.trim();
      });
      data.photoURL = profileImg.src;
      const msg = await saveProfile(uid, data);
      document.getElementById("profileMsg").innerText = msg;
    };
    logoutBtn.onclick = logout;
  </script>
</body>
</html>
