<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile - NFC Digital Business Card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      background: linear-gradient(135deg, #f8f8f6 65%, #e3ede6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .profile-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 32px rgba(70,99,95,0.10);
      width: 95%;
      max-width: 500px;
      padding: 32px 38px;
      box-sizing: border-box;
    }
    h2 {
      color: #253528;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label {
      font-weight: 600;
      color: #253528;
      font-size: 0.95rem;
      text-align: left;
    }
    input {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1.5px solid #b5c2b7;
      background: #f3f7f4;
      font-size: 1rem;
      color: #253528;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }
    input:focus {
      border-color: #46635f;
      background: #edf4ef;
    }
    button {
      background: #46635f;
      color: #fff;
      border: none;
      border-radius: 32px;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 10px rgba(70,99,95,0.06);
      letter-spacing: 0.5px;
    }
    button:hover { background: #253528; }
    .logout-btn {
      background: #d04b4b;
      margin-top: 10px;
    }
    .logout-btn:hover { background: #a53c3c; }
    .photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 16px auto;
      border: 3px solid #46635f;
    }
    #uploadLabel {
      color: #46635f;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: block;
    }
    #uploadLabel:hover { text-decoration: underline; }
    #progressContainer {
      text-align: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #253528;
      display: none;
    }
    @media (max-width: 480px) {
      .profile-card { padding: 20px; }
      input, button { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <h2>My Profile</h2>

    <img id="profilePhoto" class="photo" src="https://via.placeholder.com/110x110.png?text=Profile" alt="Profile Photo">
    <label id="uploadLabel" for="photoUpload">Change Photo</label>
    <input type="file" id="photoUpload" accept="image/*" style="display:none">
    <div id="progressContainer">Uploading... 0%</div>

    <form id="profileForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your name">

      <label for="emailField">Email</label>
      <input type="email" id="emailField" placeholder="Enter your email" readonly>

      <label for="phoneField">Phone</label>
      <input type="text" id="phoneField" placeholder="Enter your phone number">

      <label for="addressField">Address</label>
      <input type="text" id="addressField" placeholder="Enter your address">

      <label for="websiteField">Website</label>
      <input type="text" id="websiteField" placeholder="Your website or portfolio link">

      <button type="submit">Save Profile</button>
      <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
    </form>
  </div>

  <script type="module">
    import { auth, db, storage, logout } from './firebase.js';
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    import { ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

    const form = document.getElementById("profileForm");
    const photoUpload = document.getElementById("photoUpload");
    const profilePhoto = document.getElementById("profilePhoto");
    const progressContainer = document.getElementById("progressContainer");
    const logoutBtn = document.getElementById("logoutBtn");

    // 🔹 Load existing user data
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      const docRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById("fullName").value = data.fullName || "";
        document.getElementById("emailField").value = data.email || user.email;
        document.getElementById("phoneField").value = data.phone || "";
        document.getElementById("addressField").value = data.address || "";
        document.getElementById("websiteField").value = data.website || "";
        if (data.photoURL) profilePhoto.src = data.photoURL;
      } else {
        document.getElementById("emailField").value = user.email;
      }
    });

    // 🔹 Handle photo upload with progress
    photoUpload.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const user = auth.currentUser;
      if (!user) {
        alert("You must be logged in to upload a photo!");
        return;
      }

      const storageRef = ref(storage, `profile_photos/${user.uid}`);
      const uploadTask = uploadBytesResumable(storageRef, file);

      progressContainer.style.display = "block";

      uploadTask.on('state_changed', 
        (snapshot) => {
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          progressContainer.textContent = `Uploading... ${Math.round(progress)}%`;
        }, 
        (error) => {
          console.error("Upload error:", error);
          alert("❌ Upload failed: " + error.message);
          progressContainer.style.display = "none";
        }, 
        async () => {
          const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
          profilePhoto.src = downloadURL;
          await setDoc(doc(db, "users", user.uid), { photoURL: downloadURL }, { merge: true });
          progressContainer.textContent = "✅ Upload complete!";
          setTimeout(() => (progressContainer.style.display = "none"), 2000);
        }
      );
    });

    // 🔹 Save profile info
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const profileData = {
        fullName: document.getElementById("fullName").value,
        email: document.getElementById("emailField").value,
        phone: document.getElementById("phoneField").value,
        address: document.getElementById("addressField").value,
        website: document.getElementById("websiteField").value,
        updatedAt: new Date()
      };

      await setDoc(doc(db, "users", user.uid), profileData, { merge: true });
      alert("✅ Profile updated successfully!");
    });

    // 🔹 Logout
    logoutBtn.addEventListener("click", async () => {
      await logout();
    });
  </script>
</body>
</html>
