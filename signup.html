<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - NFC Digital Business Card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f8f8f6 65%, #e3ede6 100%);
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .signup-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 32px rgba(70,99,95,0.10);
      max-width: 420px;
      width: 100%;
      padding: 48px 38px 32px 38px;
      text-align: center;
      margin: 0 auto;
    }
    h2 {
      color: #253528;
      font-size: 1.38rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 14px;
    }
    input[type="email"], input[type="password"] {
      padding: 13px 14px;
      border-radius: 8px;
      border: 1.5px solid #b5c2b7;
      background: #f3f7f4;
      font-size: 1.07rem;
      color: #253528;
      outline: none;
      font-family: inherit;
      transition: border 0.2s, background 0.2s;
      margin-bottom: 0;
      box-sizing: border-box;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      border-color: #46635f;
      background: #edf4ef;
    }
    button[type="submit"] {
      background: #46635f;
      color: #fff;
      border: none;
      border-radius: 32px;
      padding: 15px 0;
      font-size: 1.13rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 18px;
      margin-bottom: 8px;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(70,99,95,0.06);
      letter-spacing: 1px;
    }
    button[type="submit"]:hover {
      background: #253528;
    }
    #signupMsg {
      color: #d04b4b;
      font-size: 1.02rem;
      text-align: center;
      min-height: 24px;
      margin-top: 6px;
    }
    @media (max-width: 500px) {
      .signup-card { padding: 22px 7vw 22px 7vw; }
      h2 { font-size: 1.09rem; }
      input, button { font-size: 0.98rem;}
      form { gap: 10px;}
    }
  </style>
</head>
<body>
  <div class="signup-card">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Create Account</button>
    </form>
    <div id="signupMsg"></div>
  </div>
  <script type="module" src="firebase.js"></script>
  <script type="module">
    import { signup } from './firebase.js';
    signupForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = await signup(email, password);
      document.getElementById("signupMsg").innerText = msg;
    };
  </script>
</body>
</html>
