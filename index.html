<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NFC Digital Business Card - Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <style>
    :root {
      --background: #f8f8f6;
      --accent: #e3ede6;
      --taupe-green: #46635f;
      --primary: #253528;
      --input-border: #b5c2b7;
      --input-bg: #f3f7f4; /* lighter than accent */
      --card-radius: 18px;
      --card-shadow: 0 4px 32px rgba(70, 99, 95, 0.10);
      --button-bg: #46635f;
      --button-hover: #253528;
      --button-text: #fff;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, var(--background) 65%, var(--accent) 100%);
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .login-card {
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      min-width: 340px;
      max-width: 370px;
      width: 100%;
      padding: 48px 38px 32px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }
    h2 {
      color: var(--primary);
      font-size: 1.65rem;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 14px;
    }
    input[type="email"], input[type="password"] {
      padding: 13px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--input-border);
      background: var(--input-bg);
      font-size: 1.08rem;
      color: var(--primary);
      outline: none;
      font-family: inherit;
      transition: border 0.2s, background 0.2s;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      border-color: var(--taupe-green);
      background: #edf4ef; /* even lighter on focus */
    }
    button[type="submit"] {
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 32px;
      padding: 14px 0;
      font-size: 1.11rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 6px;
      transition: background 0.2s;
      box-shadow: 0 2px 10px rgba(70,99,95,0.06);
      letter-spacing: 1px;
    }
    button[type="submit"]:hover {
      background: var(--button-hover);
    }
    .links {
      margin-top: 10px;
      font-size: 1rem;
      color: var(--taupe-green);
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 4px;
    }
    .links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.18s, background 0.18s;
      padding: 2px 9px;
      border-radius: 7px;
    }
    .links a:hover {
      background: var(--accent);
      color: var(--button-hover);
    }
    #loginMsg {
      color: #d04b4b;
      font-size: 1.02rem;
      text-align: center;
      min-height: 24px;
      margin-top: 10px;
    }
    @media (max-width: 500px) {
      .container { padding: 0; }
      .login-card { min-width: 97vw; max-width: 99vw; padding: 22px 7vw 22px 7vw;}
      h2 { font-size: 1.13rem; margin-bottom: 22px; }
      input, button { font-size: 0.99rem;}
      form { gap: 12px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email Address" required autocomplete="username">
        <input type="password" id="loginPass" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Login</button>
      </form>
      <div class="links">
        <a href="signup.html">Create Account</a>
        <a href="#" id="forgotPass">Forgot Password?</a>
      </div>
      <div id="loginMsg"></div>
    </div>
  </div>
  <script type="module" src="firebase.js"></script>
  <script type="module">
    import { login, sendPasswordReset } from './firebase.js';
    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = loginEmail.value, pass = loginPass.value;
      const msg = await login(email, pass);
      if(msg) document.getElementById("loginMsg").innerText = msg;
    };
    document.getElementById("forgotPass").onclick = (e) => {
      e.preventDefault();
      const email = prompt("Enter your registered email:");
      if(email) sendPasswordReset(email);
    };
  </script>
</body>
</html>
