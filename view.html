<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Business Card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
  <style>
    :root {
      --background: #f8f8f6;
      --accent: #e3ede6;
      --taupe-green: #46635f;
      --primary: #253528;
      --input-border: #b5c2b7;
      --card-radius: 18px;
      --card-shadow: 0 4px 32px rgba(70, 99, 95, 0.10);
      --button-bg: #46635f;
      --button-hover: #253528;
      --button-text: #fff;
      --info-icon: #46635f;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, var(--background) 65%, var(--accent) 100%);
      font-family: 'Montserrat', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .portrait-card {
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      max-width: 420px;
      width: 100%;
      padding: 48px 38px 32px 38px;
      text-align: center;
      margin: 0 auto;
    }
    .profile-pic-wrapper {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      border: 0.5px solid var(--input-border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: box-shadow 0.2s;
    }
    .name {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .role {
      font-size: 1.07rem;
      font-weight: 400;
      color: #666;
      letter-spacing: 2px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }
    .contact-btn {
      background: var(--button-bg);
      border: 1.5px solid var(--button-bg);
      border-radius: 32px;
      padding: 14px 0;
      width: 88%;
      font-size: 1.09rem;
      font-weight: 600;
      color: var(--button-text);
      margin: 0 auto 24px auto;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
      letter-spacing: 1px;
      display: block;
    }
    .contact-btn:hover {
      background: var(--button-hover);
      color: var(--button-text);
      border-color: var(--primary);
    }
    .info {
      width: 97%;
      margin: 0 auto;
      text-align: left;
      font-size: 1.058rem;
      color: #444;
    }
    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
      position: relative;
    }
    .info-icon {
      font-size: 1.32rem;
      min-width: 28px;
      text-align: center;
      color: var(--info-icon);
      margin-top: 2px;
      flex-shrink: 0;
    }
    .info-content {
      line-height: 1.44;
      word-break: break-word;
      flex: 1;
      color: #253528;
    }
    .social-icons a {
      display: inline-block;
      margin: 0 5px;
      vertical-align: middle;
    }
    .social-icons svg {
      width: 28px;
      height: 28px;
      display: inline-block;
      fill: #46635f;
      transition: fill 0.2s;
    }
    .social-icons a:hover svg {
      fill: #253528;
    }
    #saveContactBtn {
      display: block;
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      border-radius: 28px;
      padding: 13px 0;
      font-size: 1.09rem;
      font-weight: 600;
      cursor: pointer;
      width: 88%;
      margin: 18px auto 0 auto;
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    #saveContactBtn:hover { background: var(--button-hover); }
    @media (max-width: 500px) {
      .container { padding: 0; }
      .portrait-card { padding: 22px 7vw 22px 7vw; }
      .profile-pic { width: 80px; height: 80px;}
      .info-content { font-size: 0.97rem; }
      .social-icons svg { width: 22px; height: 22px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="portrait-card" id="publicCard"></div>
  </div>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="vcard.js"></script>
  <script type="module">
    import { getPublicProfile } from './firebase.js';
    import { generateVCard } from './vcard.js';
    const params = new URLSearchParams(window.location.search);
    const username = params.get('user');
    async function renderCard() {
      const data = await getPublicProfile(username);
      if(!data) {
        publicCard.innerHTML = "<p>Profile not found.</p>";
        return;
      }
      publicCard.innerHTML = `
        <div class="profile-pic-wrapper">
          <img src="${data.photoURL || 'icons/default-profile.png'}" alt="Profile Picture" class="profile-pic">
        </div>
        <div class="name">${data.fullName || ''}</div>
        <div class="role">${data.jobTitle || ''} ${data.company ? 'at '+data.company : ''}</div>
        <a href="mailto:${data.email}" class="contact-btn">CONTACT</a>
        <div class="info">
          <div class="info-item">
            <span class="info-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2l4 4m0 0l4-4m-4 4v4c0 4.418 3.582 8 8 8h4"></path></svg></span>
            <span class="info-content">${data.phone || ''}</span>
          </div>
          <div class="info-item">
            <span class="info-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="16" height="10" rx="2"/><polyline points="2,5 10,12 18,5"/></svg></span>
            <span class="info-content">${data.email || ''}<br>${data.website || ''}</span>
          </div>
          <div class="info-item">
            <span class="info-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2a6 6 0 0 1 6 6c0 5-6 10-6 10S4 13 4 8a6 6 0 0 1 6-6z"/><circle cx="10" cy="8" r="2"/></svg></span>
            <span class="info-content">${data.address || ""}</span>
          </div>
          <div class="social-icons">
            ${data.facebook ? `<a href="${data.facebook}" target="_blank" title="Facebook">
              <svg fill="#46635f" viewBox="0 0 24 24"><path d="M22 12.07C22 6.48 17.52 2 12 2S2 6.48 2 12.07c0 5.06 3.66 9.25 8.44 9.97v-7.06H7.9v-2.91h2.54V9.98c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.55v1.85h2.78l-.44 2.91h-2.34V22C18.34 21.32 22 17.13 22 12.07z"/></svg>
            </a>` : ''}
            ${data.instagram ? `<a href="${data.instagram}" target="_blank" title="Instagram">
              <svg fill="#46635f" viewBox="0 0 24 24"><path d="M7.75 2h8.5A5.75 5.75 0 0122 7.75v8.5A5.75 5.75 0 0116.25 22h-8.5A5.75 5.75 0 012 16.25v-8.5A5.75 5.75 0 017.75 2zm0 1.5A4.25 4.25 0 003.5 7.75v8.5A4.25 4.25 0 007.75 20.5h8.5A4.25 4.25 0 0020.5 16.25v-8.5A4.25 4.25 0 0016.25 3.5h-8.5zm4.25 3.25a5.25 5.25 0 110 10.5 5.25 5.25 0 010-10.5zm0 1.5a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5zm5.13.87a1.13 1.13 0 110 2.26 1.13 1.13 0 010-2.26z"/></svg>
            </a>` : ''}
            ${data.linkedin ? `<a href="${data.linkedin}" target="_blank" title="LinkedIn">
              <svg fill="#46635f" viewBox="0 0 24 24"><path d="M16.44 16.44h-2.22v-3.33c0-.79-.02-1.81-1.1-1.81-1.1 0-1.27.86-1.27 1.75v3.39h-2.22V9h2.13v1.02h.03c.3-.56 1.02-1.15 2.09-1.15 2.24 0 2.65 1.48 2.65 3.41v4.16zM7.13 7.13A1.13 1.13 0 117.13 9.4a1.13 1.13 0 010-2.27zm1.11 9.31H6V9H8.24v7.44zm10.11-13.62H5.75A3.75 3.75 0 002 5.75v12.5A3.75 3.75 0 005.75 22h12.5A3.75 3.75 0 0022 18.25V5.75A3.75 3.75 0 0018.25 2z"/></svg>
            </a>` : ''}
            ${data.twitter ? `<a href="${data.twitter}" target="_blank" title="Twitter">
              <svg fill="#46635f" viewBox="0 0 24 24"><path d="M21.94 7.56a8.48 8.48 0 01-2.43.67 4.23 4.23 0 001.85-2.33 8.49 8.49 0 01-2.69 1.03 4.21 4.21 0 00-7.17 3.84A11.95 11.95 0 013 5.1a4.21 4.21 0 001.31 5.62 4.18 4.18 0 01-1.91-.53v.05a4.21 4.21 0 003.38 4.13 4.23 4.23 0 01-1.9.07 4.22 4.22 0 003.93 2.92A8.47 8.47 0 013 19.54a11.93 11.93 0 006.48 1.9c7.78 0 12.04-6.45 12.04-12.04 0-.18-.01-.35-.02-.53a8.65 8.65 0 002.11-2.21z"/></svg>
            </a>` : ''}
          </div>
        </div>
        <button id="saveContactBtn">Save Contact</button>
      `;
      document.getElementById("saveContactBtn").onclick = () => {
        const vcf = generateVCard(data);
        const blob = new Blob([vcf], {type: 'text/vcard'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(data.fullName||'contact')}.vcf`;
        a.click();
      };
    }
    renderCard();
  </script>
</body>
</html>
